 * ============================================================ */
function renderAdminReport(){
  const f = state.reportFilter;
  const todayStr = formatDate(new Date());
  let html = '';

  // 筛选栏（打印时隐藏）
  html += `<div class="card no-print">`;
  html += `<div class="filter-bar">`;
  html += `<div class="filter-item"><label>起始日期（可空=从最早记录）</label><input type="date" id="rptStart" value="${f.start}"></div>`;
  html += `<div class="filter-item"><label>结束日期</label><input type="date" id="rptEnd" value="${f.end || todayStr}"></div>`;
  html += `<div class="filter-item"><button class="btn btn-primary btn-sm" onclick="execReportQuery()">生成报表</button></div>`;
  html += `<div class="filter-item"><button class="btn btn-outline btn-sm" onclick="printReport()">打印报表</button></div>`;
  html += `</div>`;
  html += `<div class="hint" style="margin:8px 0 0 0">统计指定日期范围内「有效且未结算」的订单，按员工汇总；不限定月初，随时可查，可打印交财务对账。起始日期留空表示从最早一条记录开始。</div>`;
  html += `</div>`;

  // 计算报表数据
  const end = f.end || todayStr;
  const unsettled = state.orders.filter(o =>
    o.status === 'active' && !o.settled && o.mealDate <= end && (!f.start || o.mealDate >= f.start)
  );
  const actualStart = f.start || (unsettled.length ? unsettled.map(o=>o.mealDate).sort()[0] : '最早记录');

  // 按员工汇总
  const rows = {};
  unsettled.forEach(o => {
    if(!rows[o.userId]) rows[o.userId] = {name:o.userName, deptName:o.deptName, count:0, qty:0, fee:0};
    rows[o.userId].count++;
    rows[o.userId].qty += o.quantity;
    rows[o.userId].fee += o.fee;
  });
  const rowList = Object.values(rows).sort((a,b)=>b.fee-a.fee);
  const totalCount = unsettled.length;
  const totalQty = unsettled.reduce((s,o)=>s+o.quantity,0);
  const totalFee = unsettled.reduce((s,o)=>s+o.fee,0);

  // 生成时间
  const now = getNow();
  const pad = n => String(n).padStart(2,'0');
  const genTime = `${formatDate(now)} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

  // 报表区域（打印时只显示此区域）
  html += `<div class="card" id="reportPrintArea" style="margin-top:14px">`;
  html += `<div style="text-align:center;margin-bottom:16px">`;
  html += `<div style="font-size:18px;font-weight:700;color:var(--text1)">食堂点餐系统 · 未结算报表</div>`;
  html += `<div style="font-size:13px;color:var(--text2);margin-top:6px">统计范围：${actualStart} 至 ${end}（有效且未结算订单，按员工汇总）</div>`;
  html += `<div style="font-size:12px;color:var(--text2);margin-top:2px">生成时间：${genTime}</div>`;
  html += `</div>`;

  if(rowList.length === 0){
    html += `<div class="h5-empty">该日期范围内暂无未结算记录</div>`;
  } else {
    html += `<div class="table-scroll"><table class="data-table"><thead><tr><th>序号</th><th>姓名</th><th>部门</th><th>未结算笔数</th><th>点餐份数</th><th>未结算金额</th></tr></thead><tbody>`;
    rowList.forEach((r,i) => {
      html += `<tr><td>${i+1}</td><td>${r.name}</td><td>${r.deptName}</td><td>${r.count}</td><td>${r.qty}</td><td>¥${r.fee.toFixed(2)}</td></tr>`;
    });
    html += `<tr style="font-weight:600;background:var(--primary-light)"><td colspan="3">合计（${rowList.length}人）</td><td>${totalCount}</td><td>${totalQty}</td><td>¥${totalFee.toFixed(2)}</td></tr>`;
    html += `</tbody></table></div>`;
  }
  html += `</div>`;
  return html;
}

/* 工作日历管理操作 */
function removeHolidayDate(dateStr){
  const idx = HOLIDAY_CALENDAR.holidays.indexOf(dateStr);
  if(idx >= 0){
    HOLIDAY_CALENDAR.holidays.splice(idx, 1);
    delete HOLIDAY_CALENDAR.holidayNames[dateStr];
    toast('已删除节假日：'+dateStr);
    render();
  }
}
function addHolidayDate(){
  const d = document.getElementById('newHolidayDate').value;
  const nm = document.getElementById('newHolidayName').value.trim();
  if(!d){ toast('请选择日期'); return; }
  if(HOLIDAY_CALENDAR.holidays.includes(d)){ toast('该日期已在节假日列表中'); return; }
  HOLIDAY_CALENDAR.holidays.push(d);
  if(nm) HOLIDAY_CALENDAR.holidayNames[d] = nm;
  toast('已添加节假日：'+d+(nm?'（'+nm+'）':''));
  render();
}
function removeExtraWorkday(dateStr){
  const idx = HOLIDAY_CALENDAR.extraWorkdays.indexOf(dateStr);
  if(idx >= 0){
    HOLIDAY_CALENDAR.extraWorkdays.splice(idx, 1);
    toast('已删除补班日：'+dateStr);
    render();
  }
}
function addExtraWorkday(){
  const d = document.getElementById('newExtraWorkday').value;
  if(!d){ toast('请选择日期'); return; }
  if(HOLIDAY_CALENDAR.extraWorkdays.includes(d)){ toast('该日期已在补班日列表中'); return; }

}

    const newId = Math.max(0, ...DEPTS.map(d=>d.id)) + 1;

    if(session){
      const computed = computeMealStatus(mt.type);
      if(session.status === 'open' && computed === 'locked') session.status = 'locked';
      if(session.status === 'locked' && computed === 'open') session.status = 'open';

/* Quantity stepper */
function adjustQty(mealType, delta){
  const el = document.getElementById('qty-'+mealType);
  const feeEl = document.getElementById('qtyfee-'+mealType);
  if(!el) return;
  let qty = parseInt(el.textContent) + delta;
  if(qty < 1) qty = 1;
  if(qty > 10) qty = 10;
  el.textContent = qty;
  const price = getMealPrice(mealType, getSelectedDate());
  feeEl.textContent = '¥' + (price * qty).toFixed(0);

function placeOrder(mealType){
  const selDate = getSelectedDate();
  // Past dates and non-workdays: reject
  if(selDate < formatDate(new Date())){ toast('该日期已过，无法点餐'); return; }
  if(selDate > getMaxAdvanceDate()){ toast('超出提前点餐上限（'+state.config.maxAdvanceDays+'天），无法点餐'); return; }
  if(isNonWorkday(selDate)){ toast('非工作日，食堂不开放'); return; }
  const price = getMealPrice(mealType, selDate);
  const qtyEl = document.getElementById('qty-'+mealType);
  const quantity = qtyEl ? parseInt(qtyEl.textContent) : 1;
  const user = USERS.find(u=>u.id===state.currentUserId);
  const existing = state.orders.find(o => o.userId===state.currentUserId && o.mealDate===selDate && o.mealType===mealType && o.status==='active');
  if(existing){
    existing.price = price;
    existing.quantity = quantity;
    existing.fee = price * quantity;
    toast('已更新点餐（'+quantity+'份）');
  } else {
    state.orders.push({
      id: Math.max(0, ...state.orders.map(o=>o.id)) + 1,
      userId: state.currentUserId,
      userName: user.name,
      deptId: user.deptId,
      deptName: deptName(user.deptId),
      mealDate: selDate,
      mealType: mealType,
      mealName: getMealName(mealType),
      price: price,
      quantity: quantity,
      fee: price * quantity,
      status: 'active',
      settled: false,
      settledAt: null,
      createdAt: formatDate(new Date()) + ' ' + String(getNow().getHours()).padStart(2,'0')+':'+String(getNow().getMinutes()).padStart(2,'0'),
    });
    toast(selDate + ' ' + getMealName(mealType) + ' 点餐成功（'+quantity+'份，¥'+(price*quantity)+'）');
  }
  render();
}

function cancelOrder(orderId){
  state.orders = state.orders.filter(o => o.id !== orderId);

}

function monthlySettle(settled){
  const monthVal = document.getElementById('settleMonth').value;
  if(!monthVal){ toast('请选择月份'); return; }
  const userVal = document.getElementById('settleUser') ? document.getElementById('settleUser').value : '';
  const [y,m] = monthVal.split('-').map(Number);
  const monthStart = `${monthVal}-01`;
  const monthEnd = formatDate(new Date(y, m, 0));
  let targets = state.orders.filter(o => o.status === 'active' && o.mealDate >= monthStart && o.mealDate <= monthEnd);
  if(userVal) targets = targets.filter(o => o.userId == userVal);
  if(targets.length === 0){ toast('该范围内无有效记录'); return; }
  const now = formatDate(new Date())+' '+String(getNow().getHours()).padStart(2,'0')+':'+String(getNow().getMinutes()).padStart(2,'0');
  targets.forEach(o => {
    o.settled = settled;
    o.settledAt = settled ? now : null;
  });
  const scopeText = userVal ? `${monthVal}（${userName(userVal)}）` : monthVal;
  toast(`已${settled?'结算':'取消结算'} ${scopeText} 共 ${targets.length} 条记录`);
  render();
}

function updateSettlePreview(){
  const el = document.getElementById('settlePreview');
  if(!el) return;
  const monthVal = document.getElementById('settleMonth').value;
  const userVal = document.getElementById('settleUser') ? document.getElementById('settleUser').value : '';
  if(!monthVal){ el.textContent=''; return; }
  const [y,m] = monthVal.split('-').map(Number);
  const monthStart = `${monthVal}-01`;
  const monthEnd = formatDate(new Date(y, m, 0));
  let targets = state.orders.filter(o => o.status === 'active' && o.mealDate >= monthStart && o.mealDate <= monthEnd);
  if(userVal) targets = targets.filter(o => o.userId == userVal);
  const settledCount = targets.filter(o=>o.settled).length;
  const unsettledCount = targets.length - settledCount;
  const totalFee = targets.reduce((s,o)=>s+o.fee, 0);
  const scopeText = userVal ? `（${userName(userVal)}）` : '（全部员工）';
  el.innerHTML = `${monthVal}${scopeText} 有效记录 <b>${targets.length}</b> 条，已结算 <b style="color:var(--green)">${settledCount}</b> 条，未结算 <b style="color:var(--orange)">${unsettledCount}</b> 条，合计 ¥${totalFee.toFixed(0)}`;
}

function acceptMeal(mealType){
  const dashDate = getAdminDashDate();
  const session = getSessionByDate(dashDate, mealType);
  if(session){
    session.status = 'accepted';
    toast(getMealName(mealType)+'已接单');
    render();
  }
}

function undoAccept(mealType){
  const dashDate = getAdminDashDate();
  const session = getSessionByDate(dashDate, mealType);
  if(session){
    session.status = 'open';
    toast(getMealName(mealType) + '已撤销接单，恢复点餐');
    render();
  }
}

function openPriceAdjust(mealType, date){
  const defaultPrice = state.config[mealType].price;
  const currentPrice = getMealPrice(mealType, date);
  const hasOverride = state.dayPriceOverrides[date] && state.dayPriceOverrides[date][mealType] != null;
  let html = `<div class="modal-head"><h3>调整 ${getMealName(mealType)} 临时价格（${date}）</h3><button class="modal-close" onclick="closeModal()">×</button></div>`;
  html += `<div class="modal-body">`;
  html += `<p style="margin-bottom:12px">此价格仅影响 <b>${date}</b> 当天的新点餐，不影响其他日期和历史订单。</p>`;
  html += `<div style="display:flex;gap:12px;align-items:center;margin-bottom:16px">`;
  html += `<div><div style="font-size:12px;color:var(--text2)">默认价格</div><div style="font-size:18px;font-weight:600">¥${defaultPrice}</div></div>`;
  html += `<div style="font-size:20px;color:var(--text3)">→</div>`;
  html += `<div><div style="font-size:12px;color:var(--text2)">临时价格</div><input type="number" id="adjPrice" value="${currentPrice}" min="0" step="0.5" style="width:80px;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:18px;font-weight:600"></div>`;
  html += `</div>`;
  html += `</div>`;
  html += `<div class="modal-foot">`;
  if(hasOverride){
    html += `<button class="btn btn-outline" onclick="resetDayPrice('${mealType}','${date}')">恢复默认</button>`;
  }
  html += `<button class="btn btn-outline" onclick="closeModal()">取消</button>`;
  html += `<button class="btn btn-primary" onclick="saveDayPrice('${mealType}','${date}')">保存</button>`;
  html += `</div>`;
  document.getElementById('modal').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
}

function saveDayPrice(mealType, date){
  const val = parseFloat(document.getElementById('adjPrice').value);
  if(isNaN(val) || val < 0){ toast('请输入有效价格'); return; }
  if(!state.dayPriceOverrides[date]) state.dayPriceOverrides[date] = {};
  state.dayPriceOverrides[date][mealType] = val;
  toast(getMealName(mealType) + ' ' + date + ' 临时价格已调整为 ¥' + val);
  closeModal();
  render();
}

function resetDayPrice(mealType, date){
  if(state.dayPriceOverrides[date]){
    delete state.dayPriceOverrides[date][mealType];
    if(Object.keys(state.dayPriceOverrides[date]).length === 0) delete state.dayPriceOverrides[date];
  }
  toast(getMealName(mealType) + ' ' + date + ' 已恢复默认价格');
  closeModal();
  render();
}

function closeMealPrompt(mealType){
  const reasons = state.config.closeReasons;
  let html = `<div class="modal-head"><h3>关闭${getMealName(mealType)}</h3><button class="modal-close" onclick="closeModal()">×</button></div>`;
  html += `<div class="modal-body"><p style="margin-bottom:12px">请选择或输入关闭原因（必填）：</p>`;
  reasons.forEach((r,i) => {
    html += `<div class="cb-row"><input type="radio" name="closeReason" id="cr${i}" value="${r}"><label for="cr${i}">${r}</label></div>`;
  });
  html += `<div style="margin-top:8px"><input type="text" id="customReason" placeholder="或自定义原因" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px"></div>`;
  html += `</div>`;
  html += `<div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-danger" onclick="confirmCloseMeal('${mealType}')">确认关闭</button></div>`;
  document.getElementById('modal').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
}

function confirmCloseMeal(mealType){
  const checked = document.querySelector('input[name="closeReason"]:checked');
  const custom = document.getElementById('customReason').value.trim();
  const reason = custom || (checked ? checked.value : '');
  if(!reason){ toast('请选择或输入关闭原因'); return; }
  const dashDate = getAdminDashDate();
  const session = getSessionByDate(dashDate, mealType);
  if(session){
    session.status = 'closed';
    session.closeReason = reason;
    state.orders.forEach(o => {
      if(o.mealDate === session.mealDate && o.mealType === mealType && o.status === 'active') o.status = 'void';
    });
    toast(getMealName(mealType)+'已关闭，原因：'+reason);
  }
  closeModal();
  render();
}

function reopenMeal(mealType){
  const dashDate = getAdminDashDate();
  const session = getSessionByDate(dashDate, mealType);
  if(session){
    // 未来日期截单前关闭 → 撤销回 open（员工可继续点餐）；其他情况 → 撤销回 accepted
    const isFuture = dashDate > formatDate(new Date());
    const wasBeforeCutoff = isFuture || (isToday(dashDate) && computeMealStatus(mealType) === 'open');
    if(wasBeforeCutoff){
      session.status = 'open';
    } else {
      session.status = 'accepted';
    }
    session.closeReason = null;
    state.orders.forEach(o => {
      if(o.mealDate === session.mealDate && o.mealType === mealType && o.status === 'void') o.status = 'active';
    });
    toast(getMealName(mealType) + (wasBeforeCutoff ? '已撤销关闭，恢复点餐' : '已改为接单'));
    render();
  }
}

function showDeptDetail(mealType, date, deptId){
  const orders = state.orders.filter(o => o.mealDate===date && o.mealType===mealType && o.deptId===deptId && o.status==='active');
  let html = `<div class="modal-head"><h3>${deptName(deptId)} - ${getMealName(mealType)} - ${date} 点餐明细</h3><button class="modal-close" onclick="closeModal()">×</button></div>`;
  html += `<div class="modal-body">`;
  if(orders.length === 0){
    html += `<div class="h5-empty">暂无记录</div>`;
  } else {
    html += `<div class="table-scroll"><table class="data-table"><thead><tr><th>姓名</th><th>部门</th><th>单价</th><th>份数</th><th>费用</th><th>结算状态</th></tr></thead><tbody>`;
    orders.forEach(o => {
      html += `<tr><td>${o.userName}</td><td>${o.deptName}</td><td>¥${o.price}</td><td>${o.quantity}</td><td>¥${o.fee}</td><td>${o.settled?'<span class="badge badge-settled">已结算</span>':'<span class="badge badge-unsettled">未结算</span>'}</td></tr>`;
    });
    html += `</tbody></table></div>`;
  }
  html += `</div>`;
  html += `<div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">关闭</button></div>`;
  document.getElementById('modal').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
}

function removeReason(i){ state.config.closeReasons.splice(i, 1); render(); }
function addReason(){
  const input = document.getElementById('newReason');
  const val = input.value.trim();
  if(val && !state.config.closeReasons.includes(val)){ state.config.closeReasons.push(val); input.value=''; render(); }
}
function saveConfig(){
  MEAL_TYPES.forEach(mt => {
    const t = document.getElementById(`cfg-${mt.type}-time`).value;
    const p = parseFloat(document.getElementById(`cfg-${mt.type}-price`).value);
    if(t) state.config[mt.type].time = t;
    if(p >= 0) state.config[mt.type].price = p;
  });
  state.config.cutoffHours = parseInt(document.getElementById('cfg-cutoff').value);
  state.config.autoAcceptHours = parseInt(document.getElementById('cfg-autoaccept').value);
  state.config.maxAdvanceDays = parseInt(document.getElementById('cfg-maxadvance').value);
  toast('配置已保存');
  render();
}

function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); }

function updateCountdowns(){
  if(state.role !== 'employee' || state.page !== 'home') return;
  if(!isToday(getSelectedDate())) return; // only show countdown for today
  MEAL_TYPES.forEach(mt => {
    const el = document.getElementById('cd-'+mt.type);
    if(el){
      const remain = getCutoffRemaining(mt.type);
      el.textContent = formatCountdown(remain);
      if(remain <= 0) render();
    }
  });
}

function bindEvents(){
  document.getElementById('modalOverlay').onclick = function(e){
    if(e.target === this) closeModal();
  };
}

// Start
init();
</script>
</body>
</html>
